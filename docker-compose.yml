services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/loop_pilot.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma-4-26b-a4b-it}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - loop_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loop_data: